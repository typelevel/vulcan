name: ci
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: adoptium:1.17.0.20.1
          apps: sbt
      - run: sbt validate
